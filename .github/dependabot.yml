version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "eslint"
      - dependency-name: "typescript"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # let a release age first, security updates ignore this
    cooldown:
      default-days: 7
      # our own packages go out at once
      exclude:
        - "@camera.ui/*"
        - "camera.ui"
        - "node-av"
        - "node-av-light"
        - "node-av-lgpl"
        - "@seydx/*"
        - "camera-ui-*"
        - "github.com/cameraui/*"
        - "github.com/seydx/*"
    groups:
      actions:
        patterns: ["*"]
